<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学图分享 · Claude</title>
<style>
/* ===== Claude — 对话式温和风格（含深色切换） ===== */
:root, [data-theme="light"] {
  --bg: #faf7f2; --surface: #fffef9; --border: #e8e0d5;
  --text: #3d3929; --text-secondary: #8b8574;
  --accent: #d97706; --accent-light: #fef3c7; --accent-hover: #b45309;
  --radius: 16px; --radius-sm: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
  --font: 'Georgia', 'Noto Serif SC', 'STSong', serif;
  --font-ui: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
[data-theme="dark"] {
  --bg: #1a1814; --surface: #252320; --border: #3d3830;
  --text: #e8e4d9; --text-secondary: #9d9685;
  --accent: #f59e0b; --accent-light: #3d3520; --accent-hover: #d97706;
  --shadow: 0 1px 3px rgba(0,0,0,0.3); --shadow-lg: 0 10px 25px rgba(0,0,0,0.4);
}
[data-theme="dark"] .btn-primary { color: #1a1814; }
[data-theme="dark"] .lightbox { background: rgba(0,0,0,0.95); }
[data-theme="dark"] .admin-modal { background: rgba(0,0,0,0.7); }
[data-theme="dark"] .admin-login-err { color: #f87171; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: var(--font-ui); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; transition: background 0.3s, color 0.3s; }
.disclaimer-overlay { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; align-items: center; justify-content: center; transition: background 0.3s; }
.disclaimer-card { max-width: 560px; width: 90%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 48px 40px; box-shadow: var(--shadow-lg); text-align: center; transition: background 0.3s, border-color 0.3s; }
.disclaimer-card h1 { font-family: var(--font); font-size: 1.6rem; color: var(--text); margin-bottom: 16px; font-weight: 600; }
.disclaimer-card .divider { width: 40px; height: 3px; background: var(--accent); margin: 0 auto 24px; border-radius: 2px; }
.disclaimer-card .content { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.8; margin-bottom: 32px; padding: 20px; background: var(--bg); border-radius: var(--radius-sm); }
.disclaimer-btns { display: flex; gap: 12px; justify-content: center; }
.btn { padding: 10px 28px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; border: none; font-family: var(--font-ui); transition: all 0.2s; font-weight: 500; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
.btn-ghost:hover { background: var(--bg); }
.btn-danger { background: #dc2626; color: #fff; }
.btn-danger:hover { background: #b91c1c; }
.app-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; transition: background 0.3s, border-color 0.3s; }
.app-header .logo { font-family: var(--font); font-size: 1.2rem; font-weight: 600; color: var(--text); }
.app-header .logo span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 10px; }
.back-btn { background: none; border: 1px solid var(--border); padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; color: var(--text-secondary); font-family: var(--font-ui); transition: all 0.2s; }
.back-btn:hover { background: var(--bg); }
.theme-toggle { background: none; border: 1px solid var(--border); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: all 0.2s; color: var(--text-secondary); flex-shrink: 0; }
.theme-toggle:hover { background: var(--bg); transform: rotate(20deg); }
[data-theme="dark"] .theme-toggle:hover { transform: rotate(-20deg); }
.page { display: none; max-width: 800px; margin: 0 auto; padding: 32px 20px; }
.page.active { display: block; }
.page-title { font-family: var(--font); font-size: 1.5rem; margin-bottom: 8px; color: var(--text); }
.page-subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 28px; }
.subject-list { display: flex; flex-direction: column; gap: 8px; }
.subject-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px 20px; cursor: pointer; display: flex; align-items: center; gap: 16px; transition: all 0.2s; box-shadow: var(--shadow); }
.subject-card:hover { border-color: var(--accent); box-shadow: var(--shadow-lg); transform: translateY(-1px); }
.subject-icon { width: 48px; height: 48px; background: var(--accent-light); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 700; color: var(--accent); flex-shrink: 0; }
.subject-name { font-size: 1.05rem; font-weight: 500; }
.subject-arrow { margin-left: auto; color: var(--text-secondary); font-size: 0.8rem; }
.period-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; }
.period-item { aspect-ratio: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; font-weight: 500; transition: all 0.2s; box-shadow: var(--shadow); }
.period-item:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
/* 管理员工具条（图片页顶部） */
.admin-toolbar { display: none; margin-bottom: 16px; padding: 14px 18px; background: var(--accent-light); border: 1px solid var(--border); border-radius: var(--radius-sm); align-items: center; gap: 12px; flex-wrap: wrap; }
.admin-toolbar.show { display: flex; }
.admin-toolbar .label { font-size: 0.9rem; font-weight: 600; color: var(--accent); }
.image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.image-item { position: relative; }
.image-item img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--border); transition: transform 0.2s, box-shadow 0.2s; display: block; }
.image-item img:hover { transform: scale(1.03); box-shadow: var(--shadow-lg); }
.image-item .del-img { position: absolute; top: 6px; right: 6px; background: rgba(220,38,38,0.92); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; z-index: 5; box-shadow: var(--shadow); }
.image-item.admin .del-img { display: flex; }
.no-images { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.lightbox { display: none; position: fixed; inset: 0; z-index: 9998; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; cursor: pointer; }
.lightbox.active { display: flex; }
.lightbox img { max-width: 92vw; max-height: 90vh; border-radius: 8px; object-fit: contain; }
.lightbox-close { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 2rem; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
.admin-entry { text-align: center; padding: 40px 20px; }
.admin-entry a { color: var(--text-secondary); font-size: 0.85rem; text-decoration: none; opacity: 0.6; }
.admin-entry a:hover { opacity: 1; }
[data-theme="dark"] .admin-entry a { opacity: 0.4; }
[data-theme="dark"] .admin-entry a:hover { opacity: 0.8; }
.admin-modal { display: none; position: fixed; inset: 0; z-index: 9997; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
.admin-modal.active { display: flex; }
.admin-panel { background: var(--surface); border-radius: var(--radius); padding: 32px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-lg); transition: background 0.3s; }
[data-theme="dark"] .admin-panel { border: 1px solid var(--border); }
.admin-panel h2 { font-family: var(--font); margin-bottom: 20px; color: var(--text); }
.admin-panel label { display: block; font-size: 0.9rem; margin-bottom: 4px; color: var(--text-secondary); }
.admin-panel select, .admin-panel input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; margin-bottom: 16px; font-family: var(--font-ui); background: var(--bg); color: var(--text); transition: background 0.3s, border-color 0.3s, color 0.3s; }
.admin-login-err { color: #dc2626; font-size: 0.85rem; margin-bottom: 12px; display: none; }
.admin-login-err2 { color: #dc2626; font-size: 0.85rem; margin-bottom: 12px; display: none; }
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- 免责声明 -->
<div class="disclaimer-overlay" id="disclaimerOverlay">
  <div class="disclaimer-card">
    <h1>免责声明</h1>
    <div class="divider"></div>
    <div class="content">[此处为免责声明内容]</div>
    <div class="disclaimer-btns">
      <button class="btn btn-primary" onclick="agreeDisclaimer()">同意</button>
      <button class="btn btn-ghost" onclick="disagreeDisclaimer()">不同意</button>
    </div>
  </div>
</div>

<!-- 顶部导航 -->
<header class="app-header" id="appHeader" style="display:none">
  <div class="logo">📖 学图<span>分享</span></div>
  <div class="header-right">
    <button class="back-btn" id="backBtn" onclick="goBack()" style="display:none">← 返回</button>
    <button class="back-btn" id="adminBtn" onclick="openAdminLogin()" style="display:none">管理员</button>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换深色/亮色模式">🌙</button>
  </div>
</header>

<!-- 页面容器 -->
<main>
  <div class="page active" id="page-subjects">
    <h2 class="page-title">科目</h2>
    <p class="page-subtitle">选择一个科目查看学习图片</p>
    <div class="subject-list" id="subjectList"></div>
  </div>
  <div class="page" id="page-periods">
    <h2 class="page-title" id="periodsTitle"></h2>
    <p class="page-subtitle">选择一期查看图片</p>
    <div class="period-grid" id="periodGrid"></div>
  </div>
  <div class="page" id="page-images">
    <h2 class="page-title" id="imagesTitle"></h2>
    <p class="page-subtitle">点击图片放大查看</p>
    <div class="admin-toolbar" id="adminToolbar">
      <span class="label">👑 管理员模式</span>
      <button class="btn btn-primary" onclick="pickUpload()">📤 上传图片</button>
      <button class="btn btn-ghost" onclick="logoutAdmin()">退出管理</button>
    </div>
    <input type="file" id="uploadFile" accept="image/*" multiple class="hidden" onchange="doUpload()">
    <div class="image-grid" id="imageGrid"></div>
    <div class="no-images" id="noImages" style="display:none">📭 该期暂无图片</div>
  </div>
</main>

<!-- 管理入口（底部） -->
<div class="admin-entry" id="adminEntry">
  <a href="javascript:void(0)" onclick="openAdminLogin()">管理入口</a>
</div>

<!-- 管理员登录弹窗 -->
<div class="admin-modal" id="adminLoginModal">
  <div class="admin-panel">
    <h2>管理员登录</h2>
    <label>用户名</label>
    <input type="text" id="adminUser" placeholder="admin">
    <label>密码</label>
    <input type="password" id="adminPass" placeholder="123456">
    <p class="admin-login-err2" id="adminLoginErr2">用户名或密码错误</p>
    <button class="btn btn-primary" onclick="adminLogin()" style="width:100%;margin-bottom:8px">登录</button>
    <button class="btn btn-ghost" onclick="closeAdminLogin()" style="width:100%">取消</button>
  </div>
</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img id="lightboxImg" src="" alt="">
</div>

<script>
// ===== 深色模式 =====
function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('claude_theme', next);
  updateThemeIcon(next);
}
function updateThemeIcon(t) { document.getElementById('themeToggle').textContent = t === 'dark' ? '☀️' : '🌙'; }
function applySavedTheme() {
  const saved = localStorage.getItem('claude_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon(saved);
}
applySavedTheme();

// ===== 常量 =====
const SUBJECTS = ['语文','数学','英语','物理','化学','生物'];
const TOTAL_PERIODS = 17;
const ADMIN_USER = 'admin';
const ADMIN_PASS = '123456';   // ← 管理密码（后端同此值，可自行修改）
let currentSubject = '';
let currentPeriod = 0;
let pageStack = [];
let isAdmin = false;           // 管理员登录状态
let currentImages = [];        // 当前期图片 [{id,url}]

// ===== 免责声明 =====
function agreeDisclaimer() {
  localStorage.setItem('learning_share_agreed', '1');
  document.getElementById('disclaimerOverlay').style.display = 'none';
  document.getElementById('appHeader').style.display = 'flex';
  initSubjects();
  checkAdminSession();
}
function disagreeDisclaimer() { alert('您必须同意免责声明才能使用本站。'); }

// ===== 页面导航 =====
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goBack() {
  if (pageStack.length > 0) {
    const prev = pageStack.pop();
    if (prev.page === 'subjects') { showPage('page-subjects'); document.getElementById('backBtn').style.display = 'none'; }
    else if (prev.page === 'periods') { showPage('page-periods'); }
  }
  if (pageStack.length === 0) document.getElementById('backBtn').style.display = 'none';
}

// ===== 科目页 =====
function initSubjects() {
  document.getElementById('subjectList').innerHTML = SUBJECTS.map(s =>
    `<div class="subject-card" onclick="openSubject('${s}')">
      <div class="subject-icon">${s[0]}</div>
      <span class="subject-name">${s}</span>
      <span class="subject-arrow">›</span>
    </div>`).join('');
}
function openSubject(subject) {
  currentSubject = subject;
  pageStack.push({ page: 'subjects' });
  document.getElementById('backBtn').style.display = 'inline-block';
  document.getElementById('periodsTitle').textContent = subject;
  showPage('page-periods');
  initPeriods();
}
function initPeriods() {
  let html = '';
  for (let i = 1; i <= TOTAL_PERIODS; i++)
    html += `<div class="period-item" onclick="openPeriod(${i})">${i}</div>`;
  document.getElementById('periodGrid').innerHTML = html;
}

// ===== 期数 → 图片页 =====
function openPeriod(period) {
  currentPeriod = period;
  pageStack.push({ page: 'periods' });
  document.getElementById('imagesTitle').textContent = currentSubject + ' · 第 ' + period + ' 期';
  showPage('page-images');
  loadImages();
}

// ===== 图片：从后端 API 拉取 =====
async function loadImages() {
  const grid = document.getElementById('imageGrid');
  const noImg = document.getElementById('noImages');
  grid.innerHTML = '<div class="no-images" style="display:block">⏳ 加载中...</div>';
  noImg.style.display = 'none';
  try {
    const resp = await fetch(`/api/list?subject=${encodeURIComponent(currentSubject)}&period=${currentPeriod}`);
    const data = await resp.json();
    currentImages = data.images || [];
    if (currentImages.length === 0) { grid.innerHTML = ''; noImg.style.display = 'block'; }
    else {
      noImg.style.display = 'none';
      grid.innerHTML = currentImages.map((img, i) => `
        <div class="image-item${isAdmin ? ' admin' : ''}">
          <img src="${img.url}" alt="图片 ${i+1}" loading="lazy" onclick="event.stopPropagation(); openLightbox('${img.url}')">
          <span class="del-img" onclick="event.stopPropagation(); deleteImage('${img.id}')">✕</span>
        </div>`).join('');
    }
  } catch (e) {
    grid.innerHTML = '';
    noImg.style.display = 'block';
    noImg.textContent = '⚠️ 图片加载失败，请检查网络或后端服务';
  }
}

// ===== 灯箱 =====
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }

// ===== 管理员：登录 / 退出 =====
function openAdminLogin() {
  if (isAdmin) { alert('您已处于管理员模式，可直接在图片页上传/删除图片。'); return; }
  document.getElementById('adminLoginModal').classList.add('active');
  document.getElementById('adminLoginErr2').style.display = 'none';
}
function closeAdminLogin() { document.getElementById('adminLoginModal').classList.remove('active'); }
function adminLogin() {
  const u = document.getElementById('adminUser').value.trim();
  const p = document.getElementById('adminPass').value.trim();
  if (u === ADMIN_USER && p === ADMIN_PASS) {
    isAdmin = true;
    localStorage.setItem('admin_session', '1');
    closeAdminLogin();
    showAdminUI();
    alert('✅ 已进入管理员模式：打开任意一期图片页，即可上传/删除图片。');
  } else {
    document.getElementById('adminLoginErr2').style.display = 'block';
  }
}
function logoutAdmin() {
  isAdmin = false;
  localStorage.removeItem('admin_session');
  hideAdminUI();
  alert('已退出管理员模式');
}
function checkAdminSession() {
  if (localStorage.getItem('admin_session') === '1') { isAdmin = true; showAdminUI(); }
}
function showAdminUI() {
  document.getElementById('adminBtn').style.display = 'inline-block';
  document.getElementById('adminToolbar').classList.add('show');
  document.getElementById('adminEntry').style.display = 'none';
  if (document.getElementById('page-images').classList.contains('active')) loadImages();
}
function hideAdminUI() {
  document.getElementById('adminBtn').style.display = 'none';
  document.getElementById('adminToolbar').classList.remove('show');
  document.getElementById('adminEntry').style.display = 'block';
  if (document.getElementById('page-images').classList.contains('active')) loadImages();
}

// ===== 管理员：上传图片 =====
function pickUpload() { document.getElementById('uploadFile').click(); }
async function doUpload() {
  const files = document.getElementById('uploadFile').files;
  if (!files.length) return;
  const results = { ok: 0, fail: 0 };
  for (const file of files) {
    const fd = new FormData();
    fd.append('subject', currentSubject);
    fd.append('period', currentPeriod);
    fd.append('pass', ADMIN_PASS);
    fd.append('file', file);
    try {
      const resp = await fetch('/api/upload', { method: 'POST', body: fd });
      const data = await resp.json();
      if (data.ok) results.ok++; else results.fail++;
    } catch (e) { results.fail++; }
  }
  document.getElementById('uploadFile').value = '';
  alert(`上传完成：成功 ${results.ok} 张，失败 ${results.fail} 张`);
  loadImages();
}

// ===== 管理员：删除图片 =====
async function deleteImage(id) {
  if (!confirm('确定删除这张图片吗？删除后不可恢复。')) return;
  try {
    const resp = await fetch('/api/delete', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subject: currentSubject, period: currentPeriod, id, pass: ADMIN_PASS })
    });
    const data = await resp.json();
    if (data.ok) { alert('已删除'); loadImages(); }
    else alert('删除失败：' + (data.error || '未知错误'));
  } catch (e) { alert('删除失败，请检查网络'); }
}

// ===== 键盘 =====
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLightbox(); closeAdminLogin(); } });
if (localStorage.getItem('learning_share_agreed') === '1') agreeDisclaimer();
</script>
</body>
</html>
